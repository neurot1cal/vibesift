name: Pack Audit

# Runs on every PR + push to main. Asserts the npm tarball that *would*
# be published exactly matches a hand-maintained whitelist. Catches:
#   - accidentally publishing test files, fixtures, or coverage output
#   - unexpected new files added to `package.json#files` without review
#   - removed files that consumers depend on (e.g. the LICENSE-* texts)
#   - dotfiles or secrets sneaking in via a typo'd `.npmignore`
#
# Maintenance: when you intentionally change the published file set,
# update EXPECTED_FILES below in the same commit. The diff is the
# review surface.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit-pack-contents:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v6.0.0
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # actions/setup-node@v6.4.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'

      - name: Compute actual tarball file list
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e "
            const data = JSON.parse(require('fs').readFileSync('/tmp/pack.json', 'utf8'));
            const files = data[0].files.map(f => f.path).sort();
            require('fs').writeFileSync('/tmp/actual.txt', files.join('\n') + '\n');
          "

      - name: Compare against whitelist
        env:
          # Whitelist of files allowed in the published tarball. Sorted.
          # Update in the same PR if you change package.json#files.
          EXPECTED_FILES: |
            CHANGELOG.md
            LICENSE
            LICENSE-APACHE
            LICENSE-MIT
            README.md
            package.json
            skills/vibesift/SKILL.md
            src/cli.js
            src/git.js
            src/index-renderer.js
            src/index.js
            src/install.js
            src/state.js
            src/svg-pipeline.js
            src/svg-tree.js
            src/template.js
        run: |
          printf "%s" "$EXPECTED_FILES" | grep -v '^$' | sort > /tmp/expected.txt
          if ! diff -u /tmp/expected.txt /tmp/actual.txt; then
            echo "::error::npm pack contents drifted from whitelist."
            echo "Expected:"
            cat /tmp/expected.txt
            echo "---"
            echo "Actual:"
            cat /tmp/actual.txt
            exit 1
          fi
          count=$(wc -l < /tmp/actual.txt | tr -d ' ')
          echo "npm pack contents match the whitelist ($count files)"

      - name: Tarball size sanity check
        run: |
          # Soft cap: the v0.1 tarball was 24 kB. v0.2 is in the same
          # order of magnitude. A 250 kB cap leaves ~10x headroom and
          # would catch a build artifact bloat regression instantly.
          npm pack 2>/dev/null
          size=$(stat -c%s vibesift-*.tgz 2>/dev/null || stat -f%z vibesift-*.tgz)
          echo "tarball size: $size bytes"
          if [ "$size" -gt 256000 ]; then
            echo "::error::tarball over 250 kB ($size bytes) — investigate"
            exit 1
          fi

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday morning scan to catch newly-disclosed CVEs against the
    # already-merged code.
    - cron: '17 9 * * 1'

# Top-level grants only what every job needs (read the source). The
# analyze job below elevates to write security-events for SARIF upload.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      # actions: read lets CodeQL inspect the workflow run that built
      # the analyzed code. security-events: write uploads SARIF results
      # into the repo's code-scanning view.
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        # actions/checkout@v6.0.0
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Initialize CodeQL
        # github/codeql-action@v3.35.4
        uses: github/codeql-action/init@68bde559dea0fdcac2102bfdf6230c5f70eb485e
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@68bde559dea0fdcac2102bfdf6230c5f70eb485e
        with:
          category: '/language:${{ matrix.language }}'

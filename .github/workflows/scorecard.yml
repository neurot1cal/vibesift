name: Scorecard supply-chain security

# OpenSSF Scorecard analysis. Scores the repository against the
# supply-chain security checks documented at
# https://github.com/ossf/scorecard, uploads the SARIF results to the
# Security tab, and re-runs weekly so regressions are caught even when
# main is quiet.
#
# Reference: https://github.com/ossf/scorecard-action#installation

on:
  branch_protection_rule:
  schedule:
    - cron: '0 11 * * 2'
  workflow_dispatch:
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout code
        # actions/checkout@v6.0.0
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Run analysis
        # ossf/scorecard-action@v2.4.3
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        # actions/upload-artifact@v4.6.2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        # github/codeql-action/upload-sarif@v3 (latest)
        uses: github/codeql-action/upload-sarif@9e0d7b8d25671d64c341c19c0152d693099fb5ba
        with:
          sarif_file: results.sarif

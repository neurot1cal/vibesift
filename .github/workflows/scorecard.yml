name: Scorecard supply-chain security

# OpenSSF Scorecard analysis. Scores the repository against the
# supply-chain security checks documented at
# https://github.com/ossf/scorecard, uploads the SARIF results to the
# Security tab, and re-runs weekly so regressions are caught even when
# main is quiet.
#
# Reference: https://github.com/ossf/scorecard-action#installation

on:
  branch_protection_rule:
  schedule:
    - cron: '0 11 * * 2'
  workflow_dispatch:
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout code
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run analysis
        # ossf/scorecard-action@v2.5.0
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        # actions/upload-artifact@v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        # github/codeql-action/upload-sarif@v4.39.1
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          sarif_file: results.sarif
